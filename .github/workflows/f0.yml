name: FULL ACCEPTANCE
on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: 'Exact lowercase 40-character application commit SHA (test/mock only)'
        required: true
        type: string
run-name: FULL ACCEPTANCE ${{ inputs.application_sha }}
concurrency:
  group: full-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-password
          MARIADB_DATABASE: hostider_f0_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APPLICATION_SHA: ${{ inputs.application_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
      APP_ENV: test
      HTTP_TEST_ENGINE: interpreter
      TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=hostider_f0_test;charset=utf8mb4
      TEST_DB_USER: root
      TEST_DB_PASSWORD: isolated-ci-password
    steps:
      - name: Reject malformed application SHA before checkout
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: '[[ "$APPLICATION_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.application_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact checkout independently of application tooling
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          test "$(git rev-parse "$APPLICATION_SHA^{commit}")" = "$APPLICATION_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$APPLICATION_SHA^{tree}")"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_mysql, sodium, mbstring, fileinfo, intl, zip
          coverage: none
      - run: composer install --working-dir=tools/analysis --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: composer audit --working-dir=tools/analysis --locked
      - run: php tools/analysis/vendor/phpstan/phpstan/phpstan.phar analyse --no-progress --memory-limit=512M
      - run: php tools/check.php
      - run: php tools/audit.php
      - name: Documentation encoding and credential patterns
        run: php tools/ci/doc-check.php
      - name: Verify application SHA and tree immediately before tests
        run: php tools/ci/source-proof.php
      - name: CI selection and source guard regressions (separate from application baseline)
        run: php tools/ci/self-test.php
      - run: php tests/run.php
      - run: php tests/hardening-unit.php
      - run: php tests/session.php
      - run: php tests/session-concurrency.php
      - run: php tests/session-http.php
      - run: php tests/integration.php
      - run: php tests/identity.php
      - run: php tests/identity-security.php
      - run: php tests/identity-http.php
      - run: php tests/http.php
      - run: php tests/finance-unit.php
      - run: php tests/finance.php
      - run: php tests/catalog.php
      - run: php tests/pricing.php
      - run: php tests/addons.php
      - run: php tests/orders.php
      - run: php tests/payments.php
      - run: php tests/billing-cash.php
      - run: php tests/paid-refunds.php
      - run: php tests/commerce.php
      - run: php tests/commerce-http.php
      - run: php tests/currency-change.php
      - run: php tests/commerce-events.php
      - run: php tests/post-delivery.php
      - run: php tests/http-harness.php
      - run: php tests/services-model.php
      - run: php tests/services-engine.php
      - run: php tests/services-hosting.php
      - run: php tests/services-reconciliation.php
      - run: php tests/services-lifecycle.php
      - run: php tests/services-transfer.php
      - run: php tests/services-package.php
      - run: php tests/services-http.php
      - run: php tests/services-runner.php
      - run: php tests/domains-unit.php
      - run: php tests/domains-model.php
      - run: php tests/domains-provider.php
      - run: php tests/voyar-sdk.php
      - run: php tests/domains-boundaries.php
      - run: php tests/domains-operations.php
      - run: php tests/domains-audit.php
      - run: php tests/cloud.php
      - run: php tests/cloud-races.php
      - run: php tests/cloud-sdk.php
      - run: php tests/cloud-audit.php
      - run: php tests/cloud-final-audit.php
      - run: php tests/cloud-costs.php
      - run: php tests/cloud-cost-races.php
      - run: php tests/provider-panel-http.php
      - run: php tests/support-migrations.php
      - run: php tests/support-http.php
      - run: php tests/support-e.php
      - run: php tests/migration-contract.php
      - run: php tests/migration-visibility.php
      - run: php tests/migration-import.php
      - run: php tests/migration-reconciliation.php
      - run: php tests/migration-operations.php
      - run: php tests/migration-recovery.php
      - run: php tests/migration-recovery-target.php
      - run: php tests/migration-recovery-integrity.php
      - run: node --check public/assets/support.js
      - run: node tests/support-e-state.cjs
      - name: Locked development-only Chromium checks
        run: |
          npm ci --prefix tools/browser --ignore-scripts
          npm audit --prefix tools/browser --audit-level=high
          ./tools/browser/node_modules/.bin/playwright install --with-deps chromium
          F5_E_PLAYWRIGHT="$PWD/tools/browser/node_modules/playwright" php tests/support-e-browser.php
      - name: Repeated service HTTP stability
        run: php tools/repeat-suite.php services-http 10
      - name: Repeated commerce HTTP stability
        id: http_stability
        run: php tools/repeat-suite.php commerce-http 30
      - name: Preserve first transport failure before native debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-transport-php-${{ matrix.php }}-${{ github.run_attempt }}
          path: |
            storage/ci-diagnostics/*.json
            storage/ci-stability/*.json
          if-no-files-found: warn
      - name: Capture native HTTP server crash stack after failure
        if: failure()
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
          timeout 90s env HTTP_TEST_GDB=1 php tools/repeat-suite.php commerce-http 3
      - name: Repeated session concurrency stability
        run: php tools/repeat-suite.php session-concurrency 20
      - run: node --check public/assets/commerce.js
      - run: node --check public/assets/services.js
      - run: node --check public/assets/provider-panel.js
      - name: Upload allowlisted test process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-process-diagnostics-php-${{ matrix.php }}-${{ github.run_attempt }}
          path: |
            storage/ci-diagnostics/*.json
            storage/ci-stability/*.json
          if-no-files-found: warn
      - name: Final exact application source proof
        run: php tools/ci/source-proof.php
      - name: Upload exact source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-php-${{ matrix.php }}-${{ github.run_attempt }}
          path: storage/ci-source/*.json
          if-no-files-found: error
